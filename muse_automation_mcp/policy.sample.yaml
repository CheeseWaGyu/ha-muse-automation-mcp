# ポリシー設定（任意）。`policy.yaml` として置くと有効になります。
# 既定ではここは空で、危険なサービス・特殊なトリガー種別はすべて禁止です。
# 「明示的に追加したもの」だけが許可されます（entity の存在・許可リストチェックは別途常に有効）。

# 既定で許可されるサービス:
#   1) 対象 entity のドメインと同じドメインのサービス（例: light.turn_on で light.* を操作）
#   2) persistent_notification.create / persistent_notification.dismiss
# それ以外（homeassistant.turn_on, script.* など）は、ここに書いた場合のみ許可。
# "domain.*" 形式のワイルドカード可。
# 例外: lock.* / alarm_control_panel.*（物理的に影響が大きい）と notify.*（外部送信につながる）は、
# 同ドメインでも既定では許可されません。使う場合はここにサービス単位で明示してください
# （例: lock.unlock、notify.mobile_app_my_phone）。
# この3ドメインではワイルドカード（lock.*、notify.* など）は効きません。完全なサービス名だけが有効です。
# カタログに lock / alarm / notify の entity を載せただけでは許可されません。
extra_allowed_services: []
#  - notify.mobile_app_my_phone
#  - homeassistant.turn_on
#  - lock.unlock

# 明示的に拒否するサービス（fnmatch パターン可）。許可判定より優先します:
# 同ドメインの既定許可・extra_allowed_services・既定許可サービスよりも先に効きます。
# 外部連携を持つ統合のサービスなどを、カタログに entity を載せたまま個別に止めたい場合に使います。
denied_services: []
#  - some_cloud_integration.*
#  - media_player.play_media

# 既定で許可されるトリガー種別:
#   state, numeric_state, time, time_pattern, sun, zone, template, homeassistant, calendar
# event / webhook など外部から起動できる種別はここに書かない限り禁止です。
extra_allowed_trigger_types: []
